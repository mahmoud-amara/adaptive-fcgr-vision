# Development Configuration — Adaptive CGR-Vision
# Status: DEVELOPMENT ONLY — not approved for confirmatory evaluation
# All results produced with this config must be labeled "development only"

protocol_version: "0.1.0-dev"
run_mode: "development"
created: "2026-10-09"

# --- Dataset (PROVISIONAL — pending PD-02, PD-03) ---
dataset:
  source: "ncbi_refseq"        # pending approval
  release: null                 # to be frozen before confirmatory runs
  organism_panel: null          # pending PD-02
  target_rank: null             # pending PD-01: "species" or "genus"
  assembly_levels: ["complete_genome", "chromosome"]  # pending PD-04
  max_ambiguity_fraction: 0.05  # pending PD-06
  min_length_bp: 100000         # pending PD-06
  replicon_policy: "concatenate_with_separator"  # pending PD-05
  separator: "N" # single N between contigs (does not generate valid k-mers)

# --- Representation ---
representation:
  method: "fcgr"
  k: 6                          # provisional; pending PD-08
  corner_mapping:               # fixed convention: counterclockwise from bottom-left
    A: [0.0, 0.0]               # bottom-left
    C: [0.0, 1.0]               # top-left
    G: [1.0, 1.0]               # top-right
    T: [1.0, 0.0]               # bottom-right
  row_origin: "top"             # row 0 = top of matrix (C, G corners)
  normalization: "count"        # divide by total valid k-mers; alternatives: "raw", "log1p"
  ambiguity_policy: "split_runs" # break at ambiguous bases, count within valid A/C/G/T runs
  dtype: "float32"

# --- Feature Extraction ---
features:
  registry_version: "0.1.0-dev"
  families:
    glcm:
      enabled: true
      quantization_levels: 32    # pending PD-09
      quantization_method: "log1p_equal_width"
      distances: [1, 2, 3]
      angles_deg: [0, 45, 90, 135]
      direction_aggregation: "mean"
      properties: ["contrast", "dissimilarity", "homogeneity", "energy", "correlation", "entropy"]
    spatial:
      enabled: true
      quadrant_grid: [2, 2]     # 2x2 quadrants
      coarse_grid: null          # optional finer grid
    frequency:
      enabled: true
      dct_bands: 4
      dct_normalization: "ortho"
      wavelet_name: "haar"
      wavelet_levels: 3
    edge_contrast:
      enabled: true
      gradient_method: "sobel"
      edge_thresholds: [0.01, 0.05, 0.1]  # relative to max gradient
      local_variance_windows: [3, 5]

# --- Fusion ---
fusion:
  primary_method: "weighted_concatenation"  # pending PD-10
  family_normalization: true    # normalize each family block to unit variance
  weight_grid: [0.0, 0.25, 0.5, 0.75, 1.0]  # per-family weight candidates
  weight_constraint: "nonneg_sum_to_one"
  equal_weight_baseline: true   # always run fixed equal-weight comparator

# --- Classifiers ---
classifiers:
  primary:
    - name: "svm_rbf"
      params:
        C: [0.1, 1.0, 10.0, 100.0]
        gamma: ["scale", "auto", 0.01, 0.1]
        class_weight: ["balanced"]
    - name: "random_forest"
      params:
        n_estimators: [100, 300]
        max_depth: [null, 10, 20]
        class_weight: ["balanced"]
        min_samples_leaf: [1, 3]
  secondary:
    - name: "logistic_regression"
      params:
        C: [0.01, 0.1, 1.0, 10.0]
        class_weight: ["balanced"]
        max_iter: 2000

# --- Splitting ---
splitting:
  test_fraction: 0.20           # pending PD-12
  outer_cv_folds: 5             # pending PD-12
  inner_cv_folds: 4             # pending PD-12
  grouping:
    method: null                # pending PD-07: "mmseqs2", "cdhit", "minhash"
    identity_threshold: null    # pending PD-07
    coverage_threshold: null    # pending PD-07
  stratify_by: "label"
  balancing: "class_weight"     # prefer class weights over resampling
  random_seed: 42

# --- Evaluation ---
evaluation:
  primary_metric: "macro_f1"
  secondary_metrics:
    - "balanced_accuracy"
    - "per_class_f1"
    - "per_class_precision"
    - "per_class_recall"
    - "mcc"
    - "accuracy"
    - "macro_auroc"
    - "confusion_matrix"
  effect_threshold: null        # pending PD-13
  confidence_interval: "grouped_bootstrap"
  n_bootstrap: 1000
  multiple_comparison: "holm"

# --- Reproducibility ---
reproducibility:
  seeds:
    global: 42
    split: 42
    model: 42
  deterministic: true
  n_repeats: 1                  # increase for confirmatory

# --- Output ---
output:
  base_dir: "runs/"
  run_id_format: "{date}_{task}_{split}_{representation}_{model}_{seed}_{config_hash}"
  save_predictions: true
  save_feature_weights: true
  save_config_snapshot: true
  save_environment: true
